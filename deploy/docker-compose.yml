# Default single-node Docker Compose deployment backed by SQLite.
# The public demo uses the explicit MySQL and demo Compose files instead.
services:
  matrixhub:
    image: ghcr.io/matrixhub-ai/matrixhub:${MATRIXHUB_IMAGE_TAG:-latest}
    container_name: matrixhub-apiserver
    working_dir: /workspace
    command:
      - /usr/local/bin/matrixhub
      - apiserver
      - -c
      - /etc/matrixhub/config.yaml
    ports:
      - "${MATRIXHUB_HTTP_PORT:-3001}:3001"
      - "${MATRIXHUB_SSH_PORT:-2222}:22"
    volumes:
      - ./data/matrixhub:/data/
      - ./config.yaml:/etc/matrixhub/config.yaml:ro
    restart: unless-stopped
