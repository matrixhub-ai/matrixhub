# Compatibility entry point for the SQLite deployment; docker-compose.yml now defaults to SQLite.
# Run with: docker compose -f docker-compose.sqlite.yml up -d
services:
  matrixhub:
    image: ghcr.io/matrixhub-ai/matrixhub:${MATRIXHUB_IMAGE_TAG:-latest}
    container_name: matrixhub-apiserver
    working_dir: /workspace
    command:
      - /usr/local/bin/matrixhub
      - apiserver
      - -c
      - /etc/matrixhub/config.yaml
    ports:
      - "${MATRIXHUB_HTTP_PORT:-3001}:3001"
      - "${MATRIXHUB_SSH_PORT:-2222}:22"
    volumes:
      - ./data/matrixhub:/data/
      - ./config-sqlite.yaml:/etc/matrixhub/config.yaml:ro
    restart: unless-stopped
