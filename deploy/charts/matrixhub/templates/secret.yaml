apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matrixhub.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrixhub.labels" . | nindent 4 }}
type: Opaque
data:
  matrixhub.dsn: {{ include "matrixhub.database.dsn" . | b64enc | quote }}
  {{- if not .Values.apiserver.tokenSigningExistingSecret }}
  {{- $signingKey := .Values.apiserver.tokenSigningSecret }}
  {{- if not $signingKey }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "matrixhub.fullname" .)) }}
  {{- if and $existing $existing.data (index $existing.data "token-signing-secret") }}
  {{- $signingKey = index $existing.data "token-signing-secret" | b64dec }}
  {{- else }}
  {{- $signingKey = randAlphaNum 64 }}
  {{- end }}
  {{- end }}
  {{- if or (lt (len $signingKey) 32) (eq $signingKey "insecure-dev-token-signing-secret-0000") }}
  {{- fail "apiserver.tokenSigningSecret must be a non-default secret of at least 32 bytes" }}
  {{- end }}
  token-signing-secret: {{ $signingKey | b64enc | quote }}
  {{- end }}
  {{- if and .Values.global.storage.apiserver.builtIn (eq .Values.apiserver.database.driver "mysql") (not .Values.apiserver.database.dsn) .Values.mysql.rootPassword }}
  mysql-root-password: {{ .Values.mysql.rootPassword | b64enc | quote }}
  {{- end }}
