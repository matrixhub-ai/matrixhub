# -- mysql configuration (only when global.storage.apiserver.builtIn is true)
mysql:
  # -- mysql image registry
  registry: docker.io
  # -- mysql image repository
  repository: library/mysql
  # -- mysql image tag
  tag: "8.4"
  # -- mysql pull policy
  pullPolicy: IfNotPresent
  # -- mysql persistence configuration
  persistence:
    # -- persistence size
    size: 8Gi
    # -- storage class name
    storageClass: ""
  # -- mysql pull secrets
  pullSecrets: []
  # -- mysql root password
  rootPassword: "password"

# -- global configuration
global:
  # -- image pull secrets
  imagePullSecrets: []
  # -- image registry
  imageRegistry: ""
  # -- enable built-in storage
  storage:
    apiserver:
      builtIn: true
  # -- busybox image for init containers
  busybox:
    image:
      repository: busybox
      tag: "latest"
      pullPolicy: IfNotPresent

# -- jobserver configuration (optional). If not set, jobserver is disabled.
jobServer:
  # -- enable jobserver background pollers
  enabled: true
  # -- graceful shutdown wait time
  shutdownGrace: 30s
  # -- sync policy processor configuration
  syncPolicy:
    pollInterval: 30s
    maxConcurrent: 5
    taskMaxDuration: 2h
  syncTask:
    pollInterval: 30s
    maxConcurrent: 5
    taskMaxDuration: 2h
  syncJob:
    pollInterval: 30s
    maxConcurrent: 5
    taskMaxDuration: 2h
  logDir: ""

# -- node configuration
nodeSelector: {}

# -- tolerations
tolerations: []

# -- affinity
affinity: {}
