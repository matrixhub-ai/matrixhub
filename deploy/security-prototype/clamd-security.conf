# Bounded 1 GiB artifact tier. Limits must fail closed rather than skip content.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 1100M
MaxFileSize 1100M
MaxScanSize 2300M
MaxScanTime 480000
MaxRecursion 8
MaxFiles 10000
MaxThreads 2
MaxQueue 4
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
ConcurrentDatabaseReload no
