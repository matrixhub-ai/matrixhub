syntax = "proto3";

package matrixhub.v1alpha1;

option go_package = "github.com/matrixhub-ai/matrixhub/api/go/v1alpha1;v1alpha1";

import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";
import "validate/validate.proto";
import "v1alpha1/utils.proto";

service Models {
  rpc ListModelTaskLabels(ListModelTaskLabelsRequest) returns (ListModelTaskLabelsResponse) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models/task-labels"
    };
  }
  rpc ListModelFrameLabels(ListModelFrameLabelsRequest) returns (ListModelFrameLabelsResponse) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models/library-labels"
    };
  }
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models"
    };
  }
  rpc GetModel(GetModelRequest) returns (Model) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models/{project}/{name}"
    };
  }
  rpc CreateModel(CreateModelRequest) returns (CreateModelResponse) {
    option (google.api.http) = {
      post: "/api/v1alpha1/models"
      body: "*"
    };
  }
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse) {
    option (google.api.http) = {
      delete: "/api/v1alpha1/models/{project}/{name}"
    };
  }
  rpc ListModelRevisions(ListModelRevisionsRequest) returns (ListModelRevisionsResponse) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models/{project}/{name}/revisions"
    };
  }
  rpc ListModelCommits(ListModelCommitsRequest) returns (ListModelCommitsResponse) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models/{project}/{name}/commits"
    };
  }
  rpc GetModelCommit(GetModelCommitRequest) returns (Commit) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models/{project}/{name}/commits/{id}"
    };
  }
  rpc GetModelTree(GetModelTreeRequest) returns (GetModelTreeResponse) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models/{project}/{name}/tree"
    };
  }
  rpc GetModelBlob(GetModelBlobRequest) returns (File) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models/{project}/{name}/blob"
    };
  }
  rpc UpdateModelSetting(UpdateModelSettingRequest) returns (UpdateModelSettingResponse) {
    option (google.api.http) = {
      put: "/api/v1alpha1/models/{project}/{name}/setting"
      body: "*"
    };
  }
  // CacheModel pulls a revision of a proxy-project model from upstream into
  // MatrixHub storage on the server. The model may not exist locally yet.
  // With dry_run it only lists the upstream files and reports what is already
  // cached: it never syncs, creates the model, or starts downloads.
  rpc CacheModel(CacheModelRequest) returns (ModelCacheStatus) {
    option (google.api.http) = {
      post: "/api/v1alpha1/models/{project}/{name}/cache"
      body: "*"
    };
  }
  // GetModelCache reports the local cache status of every file of a model
  // revision, and the latest pull of that commit. It is read-only: it never
  // contacts upstream and never starts downloads.
  rpc GetModelCache(GetModelCacheRequest) returns (ModelCacheStatus) {
    option (google.api.http) = {
      get: "/api/v1alpha1/models/{project}/{name}/cache"
    };
  }
}

message ListModelTaskLabelsRequest {
}

message ListModelTaskLabelsResponse {
  repeated Label items = 1;
}

message ListModelFrameLabelsRequest {
}

message ListModelFrameLabelsResponse {
  repeated Label items = 1;
}

message ListModelsRequest {
  repeated string labels = 1;
  string search = 2;
  string sort = 3;
  string project = 4;
  int32 page = 5;
  int32 page_size = 6;
  bool popular = 7;
}

message ListModelsResponse {
  repeated Model items = 1;
  Pagination pagination = 3;
}

message GetModelRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string = {min_len: 1, not_in: ["models", "datasets", "spaces", "resolve"]}];
}

message CreateModelRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string = {
    min_len: 1,
    max_len: 251,
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$",
    not_in: ["models", "datasets", "spaces", "resolve"]
  }];
}

message CreateModelResponse {
}

message DeleteModelRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string.min_len = 1];
}

message DeleteModelResponse {
}

message ListModelRevisionsRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string = {min_len: 1, not_in: ["models", "datasets", "spaces", "resolve"]}];
}

message ListModelRevisionsResponse {
  Revisions items = 1;
}

message Revisions {
  repeated Revision branches = 1;
  repeated Revision tags = 2;
}

message ListModelCommitsRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string = {min_len: 1, not_in: ["models", "datasets", "spaces", "resolve"]}];
  string revision = 3;
  // If true, include diff information for each commit.
  // Default is false to avoid returning large amounts of data.
  bool diff = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListModelCommitsResponse {
  repeated Commit items = 1;
  Pagination pagination = 2;
}

message GetModelCommitRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string = {min_len: 1, not_in: ["models", "datasets", "spaces", "resolve"]}];
  string id = 3 [(validate.rules).string.min_len = 1];
}

message GetModelTreeRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string = {min_len: 1, not_in: ["models", "datasets", "spaces", "resolve"]}];
  string revision = 3;
  string path = 4;
}

message File {
  string name = 1;
  FileType type = 2;
  string path = 3;
  int64 size = 4;
  bool lfs = 5;
  string Sha256 = 6;
  // commit with out diffs
  // only file type have commit
  Commit commit = 7;
  string url = 8;
}

message GetModelTreeResponse {
  repeated File items = 1;
}

message GetModelBlobRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string = {min_len: 1, not_in: ["models", "datasets", "spaces", "resolve"]}];
  string revision = 3;
  string path = 4;
}

message Model {
  int32  id = 1;
  string name = 2;
  string nickname = 3;
  string default_branch = 4;
  string created_at = 5;
  string updated_at = 6;
  CloneUrls clone_urls = 7;
  repeated Label labels = 8;
  string project = 9;
  string readme_content = 10;
  string size = 11;
  string parameter_count = 12;
  bool   popular = 13;
  string synced_at = 14;
}

message CloneUrls {
  string ssh_url = 1;
  string http_url = 2;
}

enum FileType {
  DIR = 0;
  FILE = 1;
}

enum Category {
  TASK = 0;
  LIBRARY = 1;
  LICENSE = 2;
  LANGUAGE = 3;
  OTHER = 4;
}

message Revision {
  string name = 1;
}

message Commit {
  string id = 1;
  string message = 2;
  string author_name = 3;
  string author_email = 4;
  string author_date = 5;
  string committer_name = 6;
  string committer_email = 7;
  string committer_date = 8;
  string diff = 9;
  string created_at = 10;
}

message Label {
  int32 id = 1;
  string name = 2;
  Category category = 3;
  string created_at = 4;
  string updated_at = 5;
}

message UpdateModelSettingRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string = {min_len: 1, not_in: ["models", "datasets", "spaces", "resolve"]}];
  google.protobuf.BoolValue popular = 3;
}

message UpdateModelSettingResponse {
}

enum CacheFileState {
  CACHE_FILE_STATE_UNSPECIFIED = 0;
  CACHE_FILE_STATE_CACHED = 1;
  CACHE_FILE_STATE_DOWNLOADING = 2;
  // Part of a running cache task, not started yet.
  CACHE_FILE_STATE_QUEUED = 3;
  CACHE_FILE_STATE_MISSING = 4;
  CACHE_FILE_STATE_FAILED = 5;
}

// How much of the selected files is in MatrixHub storage. Files stored in git
// are present once the commit is synced, so LFS objects decide between
// MISSING and PARTIAL.
enum CacheState {
  CACHE_STATE_UNSPECIFIED = 0;
  // No LFS object of the selection is cached.
  CACHE_STATE_MISSING = 1;
  CACHE_STATE_PARTIAL = 2;
  // Every selected file is cached.
  CACHE_STATE_CACHED = 3;
}

enum CacheTaskState {
  CACHE_TASK_STATE_UNSPECIFIED = 0;
  CACHE_TASK_STATE_RUNNING = 1;
  CACHE_TASK_STATE_SUCCEEDED = 2;
  CACHE_TASK_STATE_FAILED = 3;
}

message CacheModelRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  // Name of the model. As on Hugging Face, it may start with '_'.
  string name = 2 [(validate.rules).string = {
    min_len: 1,
    max_len: 251,
    pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]*$",
    not_in: ["models", "datasets", "spaces", "resolve"]
  }];
  // Branch, tag or commit. Empty means the default branch. Other refs, such as
  // refs/pr/1, are rejected: MatrixHub mirrors only branches and tags. So are
  // revision expressions such as main~1, which upstream does not resolve.
  string revision = 3 [(validate.rules).string.max_len = 255];
  // Narrow the cached files; without patterns every file of the revision is
  // cached. Patterns follow huggingface_hub fnmatch semantics: '*' and '?'
  // also match '/', and a trailing '/' selects a whole directory. A list
  // holds at most 16 patterns, and a pattern at most 256 characters and 16
  // wildcards ('*', '?' and classes).
  repeated string allow_patterns = 4 [(validate.rules).repeated = {max_items: 16, items: {string: {min_len: 1, max_len: 256}}}];
  // Files that match an ignore pattern are not cached, even when they match
  // an allow pattern. Same syntax and limits as allow_patterns.
  repeated string ignore_patterns = 5 [(validate.rules).repeated = {max_items: 16, items: {string: {min_len: 1, max_len: 256}}}];
  // Only report what a pull would do: the upstream files of the revision and
  // which of them are cached. A dry run creates nothing and downloads
  // nothing.
  bool dry_run = 6;
}

message GetModelCacheRequest {
  string project = 1 [(validate.rules).string.min_len = 1];
  // Name of the model. As on Hugging Face, it may start with '_'.
  string name = 2 [(validate.rules).string = {
    min_len: 1,
    max_len: 251,
    pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]*$",
    not_in: ["models", "datasets", "spaces", "resolve"]
  }];
  // Branch, tag or commit. Empty means the default branch.
  string revision = 3 [(validate.rules).string.max_len = 255];
}

message ModelCacheFile {
  string path = 1;
  int64 size = 2;
  bool lfs = 3;
  // LFS object id (sha256). Empty for files stored directly in git.
  string oid = 4;
  CacheFileState state = 5;
  int64 downloaded_bytes = 6;
  string error = 7;
}

message ModelCacheTotals {
  int64 files = 1;
  // Total size of the files.
  int64 bytes = 2;
  int64 cached_files = 3;
  int64 cached_bytes = 4;
  int64 downloading_files = 5;
  // Bytes downloaded so far of the files in DOWNLOADING state, not their
  // size.
  int64 downloading_bytes = 6;
  int64 queued_files = 7;
  int64 missing_files = 8;
  int64 failed_files = 9;
}

// One run of a pull.
message ModelCacheTask {
  // Opaque and unique per run: retrying a failed pull starts a new run.
  string id = 1;
  CacheTaskState state = 2;
  string started_at = 3;
  string finished_at = 4;
  string error = 5;
}

message ModelCacheStatus {
  string project = 1;
  string name = 2;
  string requested_revision = 3;
  // The branch, tag or commit that was listed: requested_revision, or the name
  // of the default branch when none was requested. A dry run leaves it empty
  // when the registry does not name its default branch.
  string revision = 4;
  string commit = 5;
  // How much of the selected files is cached; see CacheState.
  CacheState state = 6;
  ModelCacheTotals totals = 7;
  repeated ModelCacheFile files = 8;
  // The latest pull that the server knows of: of the requested selection for
  // CacheModel, of the commit for GetModelCache. Unset when there is none, for
  // example when no pull was started, the last one finished more than an hour
  // ago, or the server restarted since.
  ModelCacheTask task = 9;
  repeated string warnings = 10;
}
