name: Deploy Demo Site

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g. latest, v1.0.0, latest-6f42311)'
        required: true
        default: 'latest'

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  DEPLOY_USER: root
  DEPLOY_PATH: /root/matrixhub/deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v7

      - name: Validate image tag syntax
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'image_tag must be a valid Docker tag'
            exit 1
          fi

      - name: Prepare directories on ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Sync configs to ECS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Preserve directory structure so files land at the correct paths under /root/matrixhub
          source: "deploy/docker-compose.mysql.yml,deploy/docker-compose.demo.yml,deploy/nginx.conf,deploy/config-mysql.yaml,deploy/update-demo-env.sh"
          target: /root/matrixhub
          strip_components: 0

      - name: Write .env and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_PATH }}
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            COMPOSE_FILES=(-f docker-compose.mysql.yml -f docker-compose.demo.yml)
            echo "[$(date '+%F %T')] === deploy start (tag: ${IMAGE_TAG}) ==="

            # Preserve existing MySQL credentials and generate them only for a
            # fresh database. The same helper is exercised by CI.
            bash ./update-demo-env.sh "${IMAGE_TAG}"

            # Database image upgrades are managed separately from app releases.
            # A clean host will still pull mysql:8.4 when Compose starts it.
            docker compose "${COMPOSE_FILES[@]}" --profile prod pull matrixhub
            docker compose "${COMPOSE_FILES[@]}" --profile prod up -d --remove-orphans

            # Reload nginx config without downtime; start it if not yet running
            docker exec matrixhub-nginx nginx -s reload 2>/dev/null || \
              docker compose "${COMPOSE_FILES[@]}" --profile prod up -d --remove-orphans nginx

            echo "[$(date '+%F %T')] === deploy done ==="

      - name: Setup restart crontab
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /root/matrixhub/logs

            # Write reset script
            cat > /root/matrixhub/reset.sh << 'EOF'
            #!/bin/bash
            set -euo pipefail
            cd /root/matrixhub/deploy
            COMPOSE_FILES=(-f docker-compose.mysql.yml -f docker-compose.demo.yml)
            echo "[$(date '+%F %T')] === reset start ==="
            docker compose "${COMPOSE_FILES[@]}" --profile prod down --remove-orphans
            rm -rf data/matrixhub data/mysql
            docker compose "${COMPOSE_FILES[@]}" --profile prod up -d --remove-orphans
            echo "[$(date '+%F %T')] === reset done ==="
            EOF
            chmod +x /root/matrixhub/reset.sh

            # Setup crontab
            CRON_ENTRY="0 */6 * * * /root/matrixhub/reset.sh >> /root/matrixhub/logs/reset.log 2>&1"
            if crontab -l 2>/dev/null | grep -qF "$CRON_ENTRY"; then
              echo "crontab entry already exists, skipping"
            else
              crontab -l 2>/dev/null | grep -v 'matrixhub.*reset' > /tmp/crontab.tmp || true
              echo "$CRON_ENTRY" >> /tmp/crontab.tmp
              crontab /tmp/crontab.tmp
              rm /tmp/crontab.tmp
              echo "crontab entry updated"
            fi
