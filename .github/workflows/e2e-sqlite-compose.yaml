name: Call SQLite Compose E2E

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      ref:
        required: false
        type: string
      e2e_labels:
        required: false
        type: string
        default: smoke

jobs:
  e2e_sqlite_compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Download matrixhub image
        uses: actions/download-artifact@v8.0.2
        with:
          name: matrixhub-ci-image-${{ inputs.image_tag }}
          path: /tmp

      - name: Load and tag matrixhub image
        run: |
          docker load -i /tmp/matrixhub-ci.tar
          docker tag \
            ghcr.io/${{ github.repository }}/matrixhub-ci:${{ inputs.image_tag }} \
            ghcr.io/matrixhub-ai/matrixhub:${{ inputs.image_tag }}

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install E2E Tools
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo
          python -m pip install --requirement test/e2e_apiserver/requirements.txt
          python -m pip check
          sudo apt-get update
          sudo apt-get install --yes git-lfs openssh-client

          ginkgo version
          hf version
          git --version
          git lfs version
          ssh -V

      - name: Start SQLite Compose deployment
        env:
          MATRIXHUB_IMAGE_TAG: ${{ inputs.image_tag }}
          MATRIXHUB_HTTP_PORT: '3001'
          MATRIXHUB_SSH_PORT: '2222'
        run: docker compose -f deploy/docker-compose.sqlite.yml up --detach --wait

      - name: Run E2E smoke tests
        env:
          MATRIXHUB_BASE_URL: http://localhost:3001
          MATRIXHUB_SELF_URL: http://localhost:3001
          MATRIXHUB_SSH_HOST: 127.0.0.1
          MATRIXHUB_SSH_PORT: '2222'
        run: make test.e2e E2E_LABELS='${{ inputs.e2e_labels }}'

      - name: Show MatrixHub logs
        if: failure()
        run: docker compose -f deploy/docker-compose.sqlite.yml logs --no-color

      - name: Cleanup SQLite Compose deployment
        if: always()
        run: docker compose -f deploy/docker-compose.sqlite.yml down --volumes --remove-orphans
